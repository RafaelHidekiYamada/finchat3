services:
  - type: web
    name: finchat-cp3-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: DATABASE_URL
        value: sqlite:////tmp/finchat.db
      - key: CORS_ORIGINS
        value: https://finchat-cp3.onrender.com
      - key: LLM_ENABLED
        value: false
      - key: SEED_DEMO_DATA
        value: true

  - type: web
    name: finchat-cp3
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        value: https://finchat-cp3-api.onrender.com/api/v1
      - key: VITE_AI_REQUEST_TIMEOUT_MS
        value: 310000
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
